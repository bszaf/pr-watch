name: Build & Release

on:
  push:
    branches: [main]
    # Docs-only pushes don't change the binary — skip the rebuild/republish.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".claude/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15   # Apple Silicon + Xcode 16 (Swift 6, needed for swift-tools 6.0)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: swift --version

      - name: Build (warnings are errors)
        run: swift build -c release -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test

      - name: Build & assemble app bundle
        env:
          CI: "true"          # tells build.sh not to `open` the app
        run: ./build.sh release

      - name: Verify bundle
        run: |
          codesign --verify --deep --strict --verbose=2 "PR Watch.app"
          plutil -lint "PR Watch.app/Contents/Info.plist"

      - name: Package .app into a zip
        run: ditto -c -k --sequesterRsrc --keepParent "PR Watch.app" "PR-Watch.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PR-Watch
          path: PR-Watch.zip

      - name: Publish rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          Automated build from \`main\` @ ${GITHUB_SHA}.

          **Ad-hoc signed & unnotarized.** After downloading and unzipping, clear the
          quarantine flag before first launch (otherwise Gatekeeper blocks it):

          \`\`\`
          xattr -dr com.apple.quarantine "PR Watch.app"
          \`\`\`
          EOF
          gh release delete latest --cleanup-tag --yes 2>/dev/null || true
          gh release create latest "PR-Watch.zip" \
            --title "Latest build (${GITHUB_SHA:0:7})" \
            --notes-file notes.md \
            --prerelease \
            --target "${GITHUB_SHA}"
